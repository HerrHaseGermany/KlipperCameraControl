# =========================================================
# KlipperCameraControl - optional lightbar integration
# =========================================================
#
# This file requires the user's Klipper configuration to
# define an output pin named exactly:
#
#   [output_pin lightbar]
#
# Include this file only when that output pin is available.
# It automatically switches camera exposure when the
# lightbar changes state:
#
# Lightbar ON  = 250
# Lightbar OFF = 1000
# =========================================================


# =========================================================
# Internal lightbar state
# =========================================================

[gcode_macro _LIGHTBAR_STATE]
variable_last_state: -1
gcode:


# =========================================================
# Watch lightbar
# =========================================================

[delayed_gcode WATCH_LIGHTBAR]
initial_duration: 2
gcode:
    {% set current = printer["output_pin lightbar"].value|int %}
    {% set previous = printer["gcode_macro _LIGHTBAR_STATE"].last_state|int %}

    {% if current != previous %}

        SET_GCODE_VARIABLE MACRO=_LIGHTBAR_STATE VARIABLE=last_state VALUE={current}

        {% if current == 1 %}
            CAM_EXPOSURE VALUE=250
        {% else %}
            CAM_EXPOSURE VALUE=1000
        {% endif %}

    {% endif %}

    UPDATE_DELAYED_GCODE ID=WATCH_LIGHTBAR DURATION=0.5

# =========================================================
# KlipperCameraControl
# =========================================================
#
# Camera exposure, manual focus and autofocus control for Klipper.
#
# The installation script automatically replaces the
# command path with the actual KlipperCameraControl path.
#
# =========================================================


# =========================================================
# Camera exposure shell command
# =========================================================

[gcode_shell_command camera_exposure]
command: __KLIPPERCAMERACONTROL_PATH__/set_camera_exposure.sh
timeout: 5.
verbose: True


# =========================================================
# Manual exposure control
#
# Example:
#
# CAM_EXPOSURE VALUE=250
# =========================================================

[gcode_macro CAM_EXPOSURE]
description: Set camera exposure
gcode:
    {% set raw = params.VALUE|default(100)|string %}
    {% set value = raw|int(-1) %}

    {% if raw != value|string or value < 3 or value > 2047 %}
        { action_raise_error("Exposure must be an integer between 3 and 2047") }
    {% endif %}

    RUN_SHELL_COMMAND CMD=camera_exposure PARAMS={value}

[gcode_shell_command camera_focus]
command: __KLIPPERCAMERACONTROL_PATH__/set_camera_focus.sh
timeout: 5.
verbose: True

[gcode_shell_command camera_autofocus]
command: __KLIPPERCAMERACONTROL_PATH__/set_camera_focus.sh --autofocus
timeout: 5.
verbose: True

[gcode_macro CAM_FOCUS]
description: Set manual camera focus (0-250, step 5; disables autofocus)
gcode:
    {% set raw = params.VALUE|default(45)|string %}
    {% set focus = raw|int(-1) %}
    {% if raw != focus|string or focus < 0 or focus > 250 or focus % 5 != 0 %}
        { action_raise_error("Focus must be an integer from 0 to 250 (step 5)") }
    {% endif %}
    RUN_SHELL_COMMAND CMD=camera_focus PARAMS={focus}

[gcode_macro CAM_AUTOFOCUS]
description: Enable or disable camera autofocus (ON=1 or ON=0)
gcode:
    {% set on = params.ON|default('') %}
    {% if on not in ['0', '1'] %}
        { action_raise_error("Autofocus requires ON=0 or ON=1") }
    {% endif %}
    RUN_SHELL_COMMAND CMD=camera_autofocus PARAMS={on}

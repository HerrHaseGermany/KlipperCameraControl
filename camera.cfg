# =========================================================
# KlipperCameraControl
# =========================================================
#
# Camera exposure control for Klipper.
#
# The installation script automatically replaces the
# command path with the actual KlipperCameraControl path.
#
# Default exposure values:
#
# Lightbar ON  = 250
# Lightbar OFF = 1000
#
# Adjust these values if required for your camera.
# =========================================================


# =========================================================
# Camera exposure shell command
# =========================================================

[gcode_shell_command camera_exposure]
command: __KLIPPERCAMERACONTROL_PATH__/set_camera_exposure.sh
timeout: 5.
verbose: True


# =========================================================
# Manual exposure control
#
# Example:
#
# CAM_EXPOSURE VALUE=250
# =========================================================

[gcode_macro CAM_EXPOSURE]
description: Set camera exposure
gcode:
    {% set value = params.VALUE|default(100)|int %}

    {% if value < 3 or value > 2047 %}
        { action_raise_error("Exposure must be between 3 and 2047") }
    {% endif %}

    RUN_SHELL_COMMAND CMD=camera_exposure PARAMS={value}


# =========================================================
# Internal lightbar state
# =========================================================

[gcode_macro _LIGHTBAR_STATE]
variable_last_state: -1
gcode:


# =========================================================
# Watch lightbar
#
# Changes camera exposure automatically whenever the
# Klipper output_pin "lightbar" changes state.
# =========================================================

[delayed_gcode WATCH_LIGHTBAR]
initial_duration: 2
gcode:
    {% set current = printer["output_pin lightbar"].value|int %}
    {% set previous = printer["gcode_macro _LIGHTBAR_STATE"].last_state|int %}

    {% if current != previous %}

        SET_GCODE_VARIABLE MACRO=_LIGHTBAR_STATE VARIABLE=last_state VALUE={current}

        {% if current == 1 %}
            CAM_EXPOSURE VALUE=250
        {% else %}
            CAM_EXPOSURE VALUE=1000
        {% endif %}

    {% endif %}

    UPDATE_DELAYED_GCODE ID=WATCH_LIGHTBAR DURATION=0.5
